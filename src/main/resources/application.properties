# =============================================
# Spring Boot
# =============================================
spring.application.name=users-management

# Render asigna el puerto mediante la variable PORT.
# En local, si PORT no existe, se usa 8080.
server.port=${PORT:8080}

# DataSource y JavaMail se configuran manualmente con @Configuration
# Se excluye la auto-configuracion para evitar conflicto con las claves db.* y smtp.*
spring.autoconfigure.exclude[0]=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
spring.autoconfigure.exclude[1]=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
spring.autoconfigure.exclude[2]=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# =============================================
# Configuracion de Base de Datos PostgreSQL
# Sintaxis: ${VARIABLE_DE_ENTORNO:valor_por_defecto}
# Los valores por defecto corresponden al PostgreSQL local en Docker.
# En produccion (Render + Neon) se definen como variables de entorno.
# =============================================
db.host=${DB_HOST:localhost}
db.port=${DB_PORT:5432}
db.name=${DB_NAME:oye_db}
db.username=${DB_USERNAME:postgres}
db.password=${DB_PASSWORD:postgres}

# =============================================
# Configuracion SMTP (JavaMail)
# Nunca escribir credenciales reales en este archivo.
# =============================================
smtp.host=${SMTP_HOST:smtp.gmail.com}
smtp.port=${SMTP_PORT:587}
smtp.username=${SMTP_USERNAME:tu_correo@gmail.com}
smtp.password=${SMTP_PASSWORD:tu_app_password_aqui}
smtp.from.address=${SMTP_FROM_ADDRESS:tu_correo@gmail.com}
smtp.from.name=${SMTP_FROM_NAME:Gestion de Usuarios}

# =============================================
# Proveedor de correo activo: smtp (JavaMail) o brevo (API HTTPS)
# Render bloquea los puertos SMTP en el plan gratuito:
# en produccion se usa EMAIL_PROVIDER=brevo.
# =============================================
email.provider=${EMAIL_PROVIDER:smtp}

# =============================================
# Configuracion de Brevo (API HTTP v3)
# La API key es un secreto: solo se define como variable de entorno.
# =============================================
brevo.api-key=${BREVO_API_KEY:}
brevo.api-url=${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
brevo.sender.email=${BREVO_SENDER_EMAIL:}
brevo.sender.name=${BREVO_SENDER_NAME:Oye! - Organiza tus gastos}

# =============================================
# Seguridad JWT
# En produccion defina JWT_SECRET con al menos 32 bytes aleatorios codificados en Base64.
# =============================================
jwt.secret=${JWT_SECRET:ZGV2ZWxvcG1lbnQtb25seS1qd3Qtc2VjcmV0LW11c3QtYmUtcmVwbGFjZWQ=}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}